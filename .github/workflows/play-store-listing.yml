name: Play Store Listing

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate without committing the Play edit
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: play-store-listing
  cancel-in-progress: false

jobs:
  update-listing:
    if: github.repository == 'Yos-K/localmd-reader-release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: play-console

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Play API dependencies
        run: python -m pip install -r requirements-play-api.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Update Play Store listing
        env:
          VALIDATE_ONLY: ${{ inputs.validate_only }}
        run: |
          VALIDATE_ARGS=""
          if [ "$VALIDATE_ONLY" = "true" ]; then
            VALIDATE_ARGS="--validate-only"
          fi
          python scripts/play-update-listing.py \
            --service-account "$GOOGLE_APPLICATION_CREDENTIALS" \
            $VALIDATE_ARGS

      - name: Listing update summary
        if: always()
        run: |
          {
            echo "## Play Store listing"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | io.github.yosk.mdlite |"
            echo "| Locales | en-US, ja-JP |"
            echo "| Validate only | ${{ inputs.validate_only }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
